# Rams Design Review
# Add this to .github/workflows/rams.yml

name: Rams

on:
  pull_request:
    branches: [main]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Rams Design Review
        uses: rams-ai/rams-action@v1
        with:
          api_key: ${{ secrets.RAMS_API_KEY }}
          # path: src              # Default: src
          # mode: fast             # fast (default) or thorough
          # fail_on_critical: true # Block merge on critical issues
