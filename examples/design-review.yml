# PR review workflow for Rams
# Runs automatically on every pull request
# Copy to .github/workflows/design-review.yml

name: Design Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.tsx'
      - 'src/**/*.jsx'
      - 'src/**/*.vue'
      - 'src/**/*.svelte'
      - 'src/**/*.css'

jobs:
  design-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Required to post comments
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Rams Design Review
        uses: rams-ai/rams-action@v1
        with:
          api_key: ${{ secrets.RAMS_API_KEY }}
          # Defaults:
          # changed_only: true    # Only review files in this PR
          # mode: fast            # Two-pass for speed
          # fail_on_critical: true
