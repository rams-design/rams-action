name: 'Rams Design Review'
description: 'The design judge for your agent loop: score UI changes 0-100, emit findings and applyable patches, gate on criticals.'
author: 'Rams.ai'

branding:
  icon: 'eye'
  color: 'gray-dark'

inputs:
  api-key:
    description: 'Rams API key (rams_...), free at https://www.rams.ai/app/settings'
    required: true
  mode:
    description: '"pr" (diff against the PR base) or "since-last-run" (diff since .rams/last-reviewed-ref)'
    required: false
    default: 'pr'
  fail-on:
    description: '"critical" (default), "score<N" (e.g. score<80), or "never"'
    required: false
    default: 'critical'
  max-files:
    description: 'Cap on UI files sent (engine max 20)'
    required: false
    default: '20'

  render-swiftui:
    description: 'macOS jobs only: render the SwiftUI previews of changed files to PNGs (light and dark) and send them to the Rams render lane. This mode renders only; keep the review in your ubuntu job.'
    required: false
    default: 'false'
  swiftui-project:
    description: 'The .xcodeproj or .xcworkspace to build (default: the one at the repo root)'
    required: false
  swiftui-scheme:
    description: 'The scheme to build (default: the one named like the project, else the first)'
    required: false
  swiftui-device:
    description: 'Simulator name or udid (default: an iPhone Pro on the newest runtime the SDK supports)'
    required: false
  swiftui-runtime:
    description: 'Pin a simulator runtime, e.g. iOS-26-5'
    required: false
  swiftui-build-timeout:
    description: 'Minutes before the simulator build is stopped (the job still passes, with a warning)'
    required: false
    default: '15'
  swiftui-dark:
    description: '"false" renders light only (halves the shots)'
    required: false
    default: 'true'

outputs:
  score:
    description: 'The 0-100 design score'
  critical-count:
    description: 'Number of confirmed critical findings'
  issues-json:
    description: 'Path to the structured findings JSON'
  patches-dir:
    description: 'Directory of git-applyable patches, one per fixable finding'

runs:
  using: 'node20'
  main: 'index.mjs'
